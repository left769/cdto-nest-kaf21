site_name: Навчальний портал CDTO
site_description: Навчальні матеріали курсу підвищення кваліфікації офіцерів у сфері цифрового розвитку, цифрових трансформацій і цифровізації
site_author: Кафедра інформаційних систем та технологій
copyright: '© 2026 Кафедра інформаційних систем та технологій. Усі права захищені. Шрифт <a href="https://thedigital.gov.ua/fonts">e-Ukraine</a> © Мінцифри, CC BY 4.0.'

extra:
  generator: false
  # Офіційна назва курсу: два рядки в шапці на широких екранах
  # (overrides/partials/header.html). На вузьких — коротка site_name.
  # Логотип партнера поруч з емблемою кафедри в шапці.
  partner_logo: assets/cdto_campus_white.png
  course:
    title: Курс підвищення кваліфікації офіцерів
    subtitle: у сфері цифрового розвитку, цифрових трансформацій і цифровізації
  social:
    - icon: material/web
      link: https://mitit.mil.gov.ua/page/faculty2

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo_dep21_white.png
  favicon: assets/logo_dep21_white.ico
  language: uk
  font: false
  palette: 
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Перейти на темну тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Перейти на світлу тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css
  - stylesheets/mod-theme.css

extra_javascript:
  - javascripts/lesson.js
  - javascripts/quiz.js

# Каталог занять — на головній; program.md лишається в репозиторії як текстовий перелік.
exclude_docs: |
  program.md

# Сторінка контактів відкривається з шапки, а не з вкладок.
not_in_nav: |
  contacts.md

hooks:
  - hooks/quiz.py
  - hooks/workbook.py

# Тести лежать поза docs/ — просимо `mkdocs serve` стежити за ними.
watch:
  - quizzes
  - hooks

nav:
  - Головна: index.md
  - Заняття:
      - Модуль 1 · Стратегічні засади ЦТ:
          - Заняття 1 · Державна політика: CDTO_Meth_T1_Z1_Lecture.md
          - Заняття 2 · Нормативно-правові акти: CDTO_Meth_T1_Z2_Seminar.md
          - Заняття 3 · Організаційна структура: CDTO_Meth_T1_Z3_Lecture.md
          - Заняття 4 · OKR: CDTO_Meth_T1_Z4_Practical_OKR.md
      - Модуль 2 · Управління проєктами:
          - Заняття 1 · Методології: CDTO_Meth_T2_Z1_Lecture.md
          - Заняття 2 · Ініціювання та планування: CDTO_Meth_T2_Z2_Practical.md
          - Заняття 3 · Моніторинг і контроль: CDTO_Meth_T2_Z3_Practical.md
          - Заняття 4 · Ризик-менеджмент: CDTO_Meth_T2_Z4_Practical.md
          - Заняття 5 · Команда та ресурси: CDTO_Meth_T2_Z5_Seminar.md
          - Заняття 6 · Бюджет і фінансовий контроль: CDTO_Meth_T2_Z6_Lecture_Practical.md
          - Заняття 7 · Залежності та інтеграція: CDTO_Meth_T2_Z7_Practical.md
          - Заняття 8 · Governance та delivery: CDTO_Meth_T2_Z8_Practical.md
      - Модуль 3 · Бізнес-аналіз:
          - Заняття 1 · Основи бізнес-аналізу: CDTO_Meth_T3_Z1_Lecture.md
          - Заняття 2 · Моделювання процесів: CDTO_Meth_T3_Z2_Practical.md
          - Заняття 3 · Аналіз AS-IS / TO-BE: CDTO_Meth_T3_Z3_Practical.md
          - Заняття 4 · Вимоги та Use Cases: CDTO_Meth_T3_Z4_Practical.md
          - Заняття 5 · Аналітика зворотного зв’язку: CDTO_Meth_T3_Z5_Seminar.md
      - Модуль 4 · Впровадження ІКС:
          - Заняття 1 · Організація впровадження: CDTO_Meth_T4_Z1_Lecture.md
          - Заняття 2 · Планування впровадження: CDTO_Meth_T4_Z2_Practical.md
          - Заняття 3 · Управління стейкхолдерами: CDTO_Meth_T4_Z3_Lecture.md
          - Заняття 4 · Комунікації та фасилітація: CDTO_Meth_T4_Z4_Practical.md
      - Модуль 5 · Документи та захист інформації:
          - Заняття 1 · Документообіг і захист: CDTO_Meth_T5_Z1_Lecture.md
          - Заняття 2 · Аналітичні матеріали: CDTO_Meth_T5_Z2_Practical.md
          - Заняття 3 · Ефективна презентація: CDTO_Meth_T5_Z3_Practical.md
      - Модуль 6 · Цифрові інструменти та ШІ:
          - Заняття 1 · Інструменти й хмарні сервіси: CDTO_Meth_T6_Z1_Practical.md
          - Заняття 2 · Штучний інтелект: CDTO_Meth_T6_Z2_Practical.md
      - Модуль 7 · Управлінські навички:
          - Заняття 1 · Фасилітація та конфлікти: CDTO_Meth_T7_Z1_Practical.md
          - Заняття 2 · Управління опором: CDTO_Meth_T7_Z2_Practical.md
  - Робочий зошит:
      - Про робочий зошит: workbook/index.md
      - Легенда та кейси: workbook/cases.md
      - Тема 1–2 · Цілі й управління:
          - Крок 1 · Кейс, ролі, OKR: workbook/step-01-okr.md
          - Крок 2 · Статут і план: workbook/step-02-charter.md
          - Крок 3 · KPI і RAID-log: workbook/step-03-kpi.md
          - Крок 4 · Ризики: workbook/step-04-risks.md
          - Крок 5 · Бюджет: workbook/step-05-budget.md
          - Крок 6 · Залежності: workbook/step-06-dependencies.md
          - Крок 7 · Статус-звіт: workbook/step-07-status.md
      - Тема 3 · Аналіз і вимоги:
          - Крок 8 · Модель процесу: workbook/step-08-process.md
          - Крок 9 · TO-BE і запит на зміну: workbook/step-09-to-be.md
          - Крок 10 · Вимоги й ТЗ: workbook/step-10-requirements.md
      - Тема 4–5 · Впровадження й документи:
          - Крок 11 · План впровадження: workbook/step-11-rollout.md
          - Крок 12 · Стейкхолдери: workbook/step-12-stakeholders.md
          - Крок 13 · Аналітична записка: workbook/step-13-note.md
          - Крок 14 · Презентація: workbook/step-14-presentation.md
      - Тема 6–7 · Інструменти, ШІ, зміни:
          - Крок 15 · Беклог і MVP: workbook/step-15-backlog.md
          - Крок 16 · Прототип (MVP) і приймання: workbook/step-16-prototype.md
          - Крок 17 · Сесія пріоритезації: workbook/step-17-session.md
          - Крок 18 · Захист проєкту: workbook/step-18-defense.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

plugins:
  - search